<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AB760 — Auto problēmu palīgs</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#17191d}
header{background:#111318;color:white;text-align:center;padding:55px 20px}
.logo{font-size:44px;font-weight:900;letter-spacing:6px}
h1{font-size:40px;margin:25px 0 15px}
header p{max-width:650px;margin:auto;color:#ccc;font-size:18px;line-height:1.5}
.btn{display:inline-block;margin-top:25px;padding:15px 25px;background:white;color:#111318;border-radius:9px;text-decoration:none;font-weight:bold}
main{max-width:950px;width:92%;margin:auto}
section{padding:55px 0}
h2{text-align:center;font-size:30px;margin-bottom:35px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card,.form{background:white;border-radius:15px;padding:25px;box-shadow:0 4px 18px #0001}
.card b{font-size:28px}
.card h3{margin:15px 0 8px}
.card p{color:#666;line-height:1.5}
.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.field{margin-bottom:18px}
label{display:block;font-weight:bold;margin-bottom:7px}
input,select,textarea{width:100%;padding:13px;border:1px solid #ccc;border-radius:8px;font:inherit}
textarea{min-height:140px}
button{width:100%;padding:15px;border:0;border-radius:9px;background:#111318;color:white;font-size:16px;font-weight:bold}
